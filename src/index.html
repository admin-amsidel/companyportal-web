  <!-- Page loader: inline so it shows before the app downloads; App hides it (see app.ts). -->
  <style>
    #app-loader {
      position: fixed; inset: 0; z-index: 1000;
      display: grid; place-items: center; align-content: center; gap: 22px;
      background: #fff;
      transition: opacity .2s ease, visibility 0s;
    }
    /* during saves and refreshes inside a page: the page stays visible behind the logo */
    #app-loader.is-busy { background: rgba(255, 255, 255, .72); cursor: progress; }
    #app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease, visibility 0s .45s; }
    .ldr { position: relative; width: 156px; height: 156px; display: grid; place-items: center; }
    /* soft violet glow that breathes behind the logo */
    .ldr::before {
      content: ""; position: absolute; inset: -18px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(139, 92, 246, .38), rgba(139, 92, 246, 0));
      animation: ldr-glow 2.4s ease-in-out infinite;
    }
    .ldr__disc {
      position: relative; z-index: 1; width: 118px; height: 118px; border-radius: 50%;
      display: grid; place-items: center; background: #fff;
      box-shadow: 0 10px 30px rgba(42, 31, 107, .14), inset 0 0 0 1px #e9e5fb;
    }
    .ldr__disc img { width: 54%; height: auto; }
    /* aura rings: a violet arc sweeping forward then back, and a thin orange arc going the other way */
    .ldr__aura {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(106, 75, 240, 0) 0 50%, rgba(106, 75, 240, .35) 70%, #8b5cf6 88%, #4f46e5 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
      animation: ldr-sweep 1.6s cubic-bezier(.65, 0, .35, 1) infinite alternate;
    }
    .ldr__aura--back {
      inset: 10px;
      background: conic-gradient(from 180deg, rgba(249, 115, 22, 0) 0 60%, rgba(249, 115, 22, .3) 80%, #f97316 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      animation-name: ldr-sweep-back;
    }
    .ldr__name {
      margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: 14px;
      letter-spacing: .32em; text-indent: .32em; color: #5a3ad9; text-transform: uppercase;
    }
    @keyframes ldr-sweep { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes ldr-sweep-back { from { transform: rotate(0); } to { transform: rotate(-360deg); } }
    @keyframes ldr-glow { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.05); } }
    /* phones: a smaller ring and logo */
    @media (max-width: 560px) {
      #app-loader { gap: 16px; }
      .ldr { width: 124px; height: 124px; }
      .ldr::before { inset: -14px; }
      .ldr__disc { width: 94px; height: 94px; }
      .ldr__aura { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
      .ldr__aura--back { inset: 8px; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }
      .ldr__name { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ldr__aura { animation-duration: 4s; }
      .ldr::before { animation: none; opacity: .6; }
    }
    /* nothing animates while the loader is hidden */
    #app-loader.is-hidden *, #app-loader.is-hidden *::before { animation-play-state: paused; }
  </style>
  <noscript><style>#app-loader { display: none; }</style></noscript>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="ldr">
      <span class="ldr__aura"></span>
      <span class="ldr__aura ldr__aura--back"></span>
      <span class="ldr__disc"><img src="brand/logo-mark.svg" alt="" width="64" height="64"></span>
    </div>
    <p class="ldr__name">Company Portal</p>
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading…</span>
  </div>
  <app-root></app-root>
  <!-- safety net: never leave the loader up if the app fails to start -->
  <script>setTimeout(function () { var l = document.getElementById('app-loader'); if (l) l.classList.add('is-hidden'); }, 15000);</script>
</body>
